version: "3.7"

services:
  app_proxy:
    environment:
      # Verwijst naar de service hieronder (<app-id>_<service-name>_1)
      APP_HOST: pawbby-reborn_server_1
      APP_PORT: 3333

  server:
    image: ghcr.io/larsjarred9/pawbby-reborn:1.1.0@sha256:fc4d8e0bf25b63607b68efea280492ee36db27ad86ff407850059c980d87282b
    restart: on-failure
    ports:
      # Tuya local discovery poorten openzetten
      - "6666:6666/udp"
      - "6667:6667/udp"
    environment:
      - DATABASE_URL=file:/data/pawbby.db
      - APP_HOST=0.0.0.0
      - APP_PORT=3333
    volumes:
      # ${APP_DATA_DIR} wordt door Umbrel automatisch ingevuld
      - ${APP_DATA_DIR}/data:/data